cni:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi
global:
  hub: docker.io/istio
  proxy:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 128Mi
    seccompProfile:
      type: RuntimeDefault
    privileged: false
meshConfig:
  defaultConfig:
    holdApplicationUntilProxyStarts: true
  accessLogFile: /dev/stdout
autoscaleEnabled: false
