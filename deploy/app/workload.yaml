apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-lab
  namespace: service-lab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-lab
  namespace: service-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-lab
  template:
    metadata:
      labels:
        app: service-lab
      annotations:
        sidecar.istio.io/nativeSidecar: 'false'
        sidecar.istio.io/rewriteAppHTTPProbers: 'true'
    spec:
      serviceAccountName: service-lab
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        sysctls:
        - name: net.ipv4.ping_group_range
          value: 10001 10001
      containers:
      - name: app
        image: service-lab:security-1.0.0
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-lab
  namespace: service-lab
spec:
  selector:
    app: service-lab
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-lab
  namespace: service-lab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: app.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-lab
            port:
              number: 80
