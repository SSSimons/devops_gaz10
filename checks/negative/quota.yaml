apiVersion: v1
kind: Pod
metadata:
  name: deny-quota
  namespace: service-lab
  labels:
    app: security-probe
  annotations:
    sidecar.istio.io/inject: 'false'
spec:
  serviceAccountName: service-lab
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
    sysctls:
    - name: net.ipv4.ping_group_range
      value: 10001 10001
  containers:
  - name: probe-0
    image: service-lab:security-1.0.0
    imagePullPolicy: Never
    command:
    - python
    - -c
    - import time; time.sleep(3600)
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: '1'
        memory: 256Mi
        ephemeral-storage: 128Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  - name: probe-1
